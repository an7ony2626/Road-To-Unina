spring.application.name=demo

# --- Datasource: adapt these 3 values to the DB you created in pgAdmin ---
spring.datasource.url=jdbc:postgresql://localhost:5432/roadtounina
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# --- Hibernate: validate against schema.sql, do not generate/modify anything ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable open-in-view: without this, Spring keeps a Hibernate session
# open for the entire HTTP request automatically, hiding lazy-loading issues
# until they blow up in production. It is better to fail fast in development
# than to find out during a demo.
spring.jpa.open-in-view=false